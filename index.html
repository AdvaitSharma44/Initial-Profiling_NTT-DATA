<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lead Enrichment Upload</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div class="max-w-4xl mx-auto p-6">
    <div class="bg-white shadow-lg rounded-2xl p-8">
      <h1 class="text-3xl font-semibold mb-3">Lead Enrichment Upload</h1>
      <p class="text-slate-600 mb-6">Upload a company list in .xlsx or .csv format and select a region for enrichment.</p>

      <form id="uploadForm" class="space-y-6">
        <div>
          <label for="file" class="block text-sm font-medium text-slate-700 mb-2">Upload File</label>
          <input id="file" name="file" type="file" accept=".xlsx,.csv" required class="block w-full text-sm text-slate-900 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-slate-100 file:text-slate-700" />
        </div>
        <div>
          <label for="region" class="block text-sm font-medium text-slate-700 mb-2">Region / City</label>
          <select id="region" name="region" required class="mt-1 block w-full rounded-xl border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-3">
            <option value="Pan-India" selected>Pan-India (Auto-Discover)</option>
            <option value="">Select region</option>
            <option value="Mumbai">Mumbai</option>
            <option value="Delhi">Delhi</option>
            <option value="Bangalore">Bangalore</option>
            <option value="Hyderabad">Hyderabad</option>
            <option value="Chennai">Chennai</option>
            <option value="Pune">Pune</option>
            <option value="Kolkata">Kolkata</option>
            <option value="Ahmedabad">Ahmedabad</option>
            <option value="Jaipur">Jaipur</option>
            <option value="Lucknow">Lucknow</option>
          </select>
        </div>
        <div>
          <button type="submit" class="inline-flex items-center justify-center rounded-xl bg-indigo-600 px-6 py-3 text-base font-semibold text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">Upload & Enrich</button>
        </div>
      </form>

      <div id="message" class="mt-6 rounded-xl p-4 hidden"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('uploadForm');
    const messageContainer = document.getElementById('message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      messageContainer.classList.add('hidden');
      messageContainer.textContent = '';

      const fileInput = document.getElementById('file');
      const regionInput = document.getElementById('region');
      const file = fileInput.files[0];
      const region = regionInput.value;

      if (!file) {
        showMessage('Please select a file to upload.', 'bg-red-50 text-red-700 border border-red-200');
        return;
      }

      if (!region) {
        showMessage('Please choose a region before uploading.', 'bg-red-50 text-red-700 border border-red-200');
        return;
      }

      const formData = new FormData();
      formData.append('file', file);
      formData.append('region', region);

      try {
        const response = await fetch('/api/v1/enrich', {
          method: 'POST',
          body: formData,
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText || 'Upload failed');
        }

        const blob = await response.blob();
        const downloadUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = downloadUrl;
        link.download = 'enriched_leads.xlsx';
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(downloadUrl);

        showMessage('Enrichment complete. File download should begin automatically.', 'bg-green-50 text-green-700 border border-green-200');
      } catch (error) {
        showMessage(`Upload failed: ${error.message}`, 'bg-red-50 text-red-700 border border-red-200');
      }
    });

    function showMessage(text, classNames) {
      messageContainer.textContent = text;
      messageContainer.className = `mt-6 rounded-xl p-4 ${classNames}`;
      messageContainer.classList.remove('hidden');
    }
  </script>
</body>
</html>
